name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake sdl2 libogg libvorbis

      - name: Inject Dummy iOS Platform File
        run: |
          mkdir -p platforms
          echo "# Platform config for iOS" > platforms/iOS.cmake

      - name: Configure CMake
        run: |
          mkdir build_ios
          cd build_ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_FLAGS="-target arm64-apple-ios14.0 -miphoneos-version-min=14.0" \
            -DCMAKE_CXX_FLAGS="-target arm64-apple-ios14.0 -miphoneos-version-min=14.0" \
            -DRETRO_BUILD_HEADLESS=OFF

      - name: Build Project
        run: |
          cd build_ios
          make -j$(sysctl -n hw.ncpu)

      - name: Package IPA
        run: |
          cd build_ios
          mkdir -p Payload/RSDKv4.app
          
          # Copia o executável gerado
          find . -maxdepth 2 -type f \( -name "RSDKv4" -o -name "RetroEngine" \) -exec cp {} Payload/RSDKv4.app/ \;
          
          # Copia o Info.plist caso exista
          if [ -f "../iOS/Info.plist" ]; then
            cp ../iOS/Info.plist Payload/RSDKv4.app/
          fi
          
          zip -r RSDKv4.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-IPA
          path: build_ios/RSDKv4.ipa
