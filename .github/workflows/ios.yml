name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake sdl2 libogg libvorbis

      - name: Patch CMake for iOS (Disable Desktop OpenGL)
        run: |
          # Patch direto no CMakeLists.txt raiz para impedir que ele force OpenGL de Desktop no iOS
          sed -i '' 's/set(RETRO_USING_OPENGL ON)/set(RETRO_USING_OPENGL OFF)/g' CMakeLists.txt || true
          sed -i '' 's/add_definitions(-DRETRO_USING_OPENGL=1)/add_definitions(-DRETRO_USING_OPENGL=0)/g' CMakeLists.txt || true

      - name: Configure CMake for iOS
        run: |
          mkdir build_ios
          cd build_ios
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRETRO_USING_OPENGL=OFF \
            -DRETRO_USING_GLES=ON \
            -DRETRO_USING_GLES2=ON \
            -DRETRO_USING_SDL2=ON

      - name: Build with Xcode
        run: |
          cd build_ios
          xcodebuild -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd build_ios
          mkdir -p Payload/RSDKv4.app
          
          # Copia os executáveis gerados
          find build/Release-iphoneos/ -name "RSDKv4*" -type f -exec cp {} Payload/RSDKv4.app/ \; 2>/dev/null || true
          find build/Release-iphoneos/ -name "RetroEngine*" -type f -exec cp {} Payload/RSDKv4.app/ \; 2>/dev/null || true
          
          if [ -f "../iOS/Info.plist" ]; then
            cp ../iOS/Info.plist Payload/RSDKv4.app/
          fi
          
          zip -r RSDKv4.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-IPA
          path: build_ios/RSDKv4.ipa
