name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake sdl2 libogg libvorbis

      - name: Configure CMake for iOS
        run: |
          mkdir build_ios
          cd build_ios
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRETRO_BUILD_HEADLESS=OFF

      - name: Build with Xcode
        run: |
          cd build_ios
          xcodebuild -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd build_ios
          mkdir -p Payload/RSDKv4.app
          find build -name "RSDKv4" -exec cp {} Payload/RSDKv4.app/ \; 2>/dev/null || find build -name "RetroEngine" -exec cp {} Payload/RSDKv4.app/ \; 2>/dev/null || true
          if [ -f "../iOS/Info.plist" ]; then cp ../iOS/Info.plist Payload/RSDKv4.app/; fi
          zip -r RSDKv4.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-IPA
          path: build_ios/RSDKv4.ipa
