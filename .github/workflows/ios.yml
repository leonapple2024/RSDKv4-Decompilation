name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake sdl2 libogg libvorbis

      - name: Patch Root CMakeLists.txt
        run: |
          # Desativa o OpenGL de Desktop no CMake principal
          sed -i '' 's/set(RETRO_USING_OPENGL ON)/set(RETRO_USING_OPENGL OFF)/g' CMakeLists.txt || true
          sed -i '' 's/add_definitions(-DRETRO_USING_OPENGL=1)//g' CMakeLists.txt || true

      - name: Create platforms/iOS.cmake
        run: |
          mkdir -p platforms
          cat << 'EOF' > platforms/iOS.cmake
          file(GLOB_RECURSE ENGINE_SOURCES "RSDKv4/*.cpp" "RSDKv4/*.c" "RSDKv4/*.m" "RSDKv4/*.mm")
          add_executable(RetroEngine ${ENGINE_SOURCES})

          target_compile_definitions(RetroEngine PRIVATE 
            RETRO_USING_GLES=1 
            RETRO_USING_GLES2=1
            RETRO_USING_OPENGL=0
            __IPHONEOS__=1
          )

          target_link_libraries(RetroEngine PRIVATE
            "-framework OpenGLES"
            "-framework QuartzCore"
            "-framework UIKit"
            "-framework AudioToolbox"
            "-framework AVFoundation"
            "-framework CoreAudio"
          )
          EOF

      - name: Configure CMake for iOS
        run: |
          mkdir build_ios
          cd build_ios
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRETRO_USING_OPENGL=OFF \
            -DRETRO_USING_GLES=ON \
            -DRETRO_USING_GLES2=ON

      - name: Build with Xcode
        run: |
          cd build_ios
          xcodebuild -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd build_ios
          mkdir -p Payload/RSDKv4.app
          
          find build/Release-iphoneos/ -name "RSDKv4*" -type f -exec cp {} Payload/RSDKv4.app/ \; 2>/dev/null || true
          find build/Release-iphoneos/ -name "RetroEngine*" -type f -exec cp {} Payload/RSDKv4.app/ \; 2>/dev/null || true
          
          if [ -f "../iOS/Info.plist" ]; then
            cp ../iOS/Info.plist Payload/RSDKv4.app/
          fi
          
          zip -r RSDKv4.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-IPA
          path: build_ios/RSDKv4.ipa
